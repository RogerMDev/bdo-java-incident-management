# Nombre de la aplicacion
spring.application.name=incidencias

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:incidenciasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Inicializar la base de datos mediante schema.sql
spring.sql.init.mode=always

# Evitar que Hibernate cree las tablas automaticamente
spring.jpa.hibernate.ddl-auto=none

# Habilitar la consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Codificacion de los scripts SQL
spring.sql.init.encoding=UTF-8