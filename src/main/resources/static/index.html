
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de incidencias</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>

<main>
    <h1>Gestión de incidencias</h1>
    <p>Consulta y filtra las incidencias registradas.</p>

    <label for="filtroEstado">Filtrar por estado:</label>

    <select id="filtroEstado">
        <option value="">Todas</option>
        <option value="ABIERTA">Abiertas</option>
        <option value="EN_CURSO">En curso</option>
        <option value="CERRADA">Cerradas</option>
    </select>

    <p id="mensajeError" role="alert" hidden></p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Prioridad</th>
            <th>Estado</th>
            <th>Usuario asignado</th>
        </tr>
        </thead>
        <tbody id="tablaIncidencias">
        <!-- JavaScript insertara aqui las incidencias -->
        </tbody>
    </table>
</main>


<section>
    <h2>Crear nueva incidencia</h2>

    <form id="formIncidencia">

        <label for="titulo">Título:</label>
        <input type="text" id="titulo"
               maxlength="100" required>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion"
                  maxlength="1000"></textarea>

        <label for="prioridad">Prioridad:</label>
        <select id="prioridad" required>
            <option value="BAJA">Baja</option>
            <option value="MEDIA">Media</option>
            <option value="ALTA">Alta</option>
        </select>

        <label for="usuarioId">ID del usuario (opcional):</label>
        <input type="number" id="usuarioId" min="1">

        <button type="submit">Crear incidencia</button>
    </form>

    <p id="mensajeFormulario" role="status"></p>
</section>

</body>
</html>
